[project]
name = "etod-obstacle-qc"
version = "1.0.0"
description = "Rule-based quality control of e-TOD obstacle datasets with vendor issue logs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "shapely>=2.0", "pyproj>=3.5", "pyyaml>=6", "openpyxl>=3.1", "matplotlib>=3.7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
